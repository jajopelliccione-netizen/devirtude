<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin | Roma De Virtute</title>
<link rel="icon" href="../assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--nero:#0d0d0d;--grafite:#1a1a1a;--grafite2:#242424;--arancio:#f25c05;--grigio:#9a9a9a;--linea:#2c2c2c;--ok:#3ecf6e;--err:#ff5a4f}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--nero);color:#fff;line-height:1.5;min-height:100vh}
a{color:inherit}
h1,h2,h3{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.02em}
.hidden{display:none!important}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:1.5rem;
  background:radial-gradient(ellipse at 50% 0,rgba(242,92,5,.25),transparent 60%),var(--nero)}
.login-box{width:min(420px,100%);background:var(--grafite);border:1px solid var(--linea);border-radius:22px;padding:2.2rem}
.login-box img{display:block;width:90px;margin:0 auto 1rem;border-radius:50%;box-shadow:0 0 0 4px var(--arancio)}
.login-box h1{text-align:center;font-size:2rem;margin-bottom:1.5rem}

/* Form */
label{display:block;font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--grigio);margin:0 0 .35rem}
input,select,textarea{width:100%;background:var(--nero);border:2px solid var(--linea);color:#fff;border-radius:10px;padding:.7rem .85rem;font:inherit;transition:border-color .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--arancio)}
input[type=file]{padding:.6rem}
.field{margin-bottom:1rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;background:var(--arancio);color:#fff;border:0;border-radius:50px;font:inherit;font-weight:700;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;padding:.8rem 1.5rem;cursor:pointer;transition:.2s}
.btn:hover{background:#fff;color:var(--nero)}
.btn:disabled{opacity:.5;cursor:wait}
.btn.line{background:none;border:2px solid var(--linea);color:#fff}
.btn.line:hover{border-color:var(--arancio);background:none;color:var(--arancio)}
.btn.danger{background:none;border:2px solid var(--err);color:var(--err)}
.btn.danger:hover{background:var(--err);color:#fff}
.btn.sm{padding:.45rem .9rem;font-size:.7rem}
.msg{font-size:.88rem;margin-top:.8rem;min-height:1.3rem}
.msg.ok{color:var(--ok)} .msg.err{color:var(--err)}

/* Layout */
header{position:sticky;top:0;z-index:10;background:rgba(13,13,13,.92);backdrop-filter:blur(10px);border-bottom:3px solid var(--arancio)}
.bar{width:min(1100px,100% - 2rem);margin:auto;display:flex;align-items:center;justify-content:space-between;gap:1rem;height:66px}
.bar .brand{display:flex;align-items:center;gap:.7rem;font-family:'Anton';font-size:1.2rem;text-transform:uppercase}
.bar img{width:40px;height:40px;border-radius:50%}
.bar .right{display:flex;align-items:center;gap:.8rem;font-size:.8rem;color:var(--grigio)}
main{width:min(1100px,100% - 2rem);margin:2rem auto 5rem}
.tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:2rem}
.tab{background:var(--grafite);border:2px solid var(--linea);color:var(--grigio);font:inherit;font-weight:700;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;padding:.7rem 1.3rem;border-radius:50px;cursor:pointer;transition:.2s}
.tab:hover{color:#fff}
.tab.on{background:var(--arancio);border-color:var(--arancio);color:#fff}
.badge{display:inline-block;background:#fff;color:var(--nero);border-radius:20px;font-size:.7rem;padding:0 .5rem;margin-left:.4rem}
.card{background:var(--grafite);border:1px solid var(--linea);border-radius:18px;padding:1.6rem;margin-bottom:1.5rem}
.card h2{font-size:1.6rem;margin-bottom:1.2rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 1rem}
.empty{color:var(--grigio);padding:1rem 0}

/* Liste */
.item{display:grid;grid-template-columns:90px 1fr auto;gap:1.2rem;align-items:center;padding:1rem 0;border-top:1px solid var(--linea)}
.item:first-of-type{border-top:0}
.item .d{font-family:'Anton';font-size:1.7rem;line-height:1.05;color:var(--arancio)}
.item .d small{display:block;font-family:'Inter';font-size:.7rem;color:var(--grigio);font-weight:500}
.item h3{font-size:1.2rem;line-height:1.2}
.item p{color:var(--grigio);font-size:.88rem}
.pill{display:inline-block;font-size:.65rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border:2px solid var(--arancio);border-radius:20px;padding:.1rem .6rem;margin-left:.4rem;vertical-align:middle;color:var(--arancio)}
.pill.res{background:var(--arancio);color:#fff}
.actions{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:flex-end}
.passata{opacity:.55}

/* Foto */
.fotogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1rem}
.foto{background:var(--nero);border:1px solid var(--linea);border-radius:14px;overflow:hidden}
.foto img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.foto div{padding:.6rem;display:flex;gap:.4rem;justify-content:space-between;align-items:center;font-size:.75rem;color:var(--grigio)}
.prog{height:6px;background:var(--linea);border-radius:6px;overflow:hidden;margin-top:.8rem}
.prog i{display:block;height:100%;width:0;background:var(--arancio);transition:width .2s}

/* Messaggi */
.mess{padding:1.2rem;border:1px solid var(--linea);border-radius:14px;margin-bottom:.8rem;background:var(--nero)}
.mess.nuovo{border-color:var(--arancio)}
.mess header{all:unset;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:.5rem}
.mess b{font-size:1.02rem}
.mess time{color:var(--grigio);font-size:.8rem}
.mess .testo{white-space:pre-wrap;margin:.6rem 0 1rem;color:#ddd;word-break:break-word}
.mess .contatti{font-size:.85rem;color:var(--grigio)}
.mess .contatti a{color:var(--arancio)}

@media(max-width:700px){
  .grid2,.grid3{grid-template-columns:1fr}
  .item{grid-template-columns:70px 1fr}
  .item .actions{grid-column:1/-1;justify-content:flex-start}
  .bar .right span{display:none}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="login">
  <form class="login-box" id="formLogin">
    <img src="../assets/logo.png" alt="Roma De Virtute">
    <h1>Area admin</h1>
    <div class="field"><label for="lEmail">Email</label><input id="lEmail" type="email" autocomplete="username" required></div>
    <div class="field"><label for="lPass">Password</label><input id="lPass" type="password" autocomplete="current-password" required></div>
    <button class="btn" style="width:100%" type="submit">Entra</button>
    <p class="msg err" id="lMsg"></p>
  </form>
</div>

<!-- PANNELLO -->
<div id="app" class="hidden">
  <header>
    <div class="bar">
      <div class="brand"><img src="../assets/logo.png" alt=""> Pannello admin</div>
      <div class="right"><span id="utente"></span><a class="btn line sm" href="../" target="_blank">Vedi sito</a><button class="btn line sm" id="esci">Esci</button></div>
    </div>
  </header>

  <main>
    <div class="tabs">
      <button class="tab on" data-tab="partite">Partite</button>
      <button class="tab" data-tab="foto">Foto</button>
      <button class="tab" data-tab="messaggi">Messaggi<span class="badge hidden" id="nuovi">0</span></button>
    </div>

    <!-- PARTITE -->
    <section id="t-partite">
      <div class="card">
        <h2 id="titoloForm">Aggiungi partita</h2>
        <form id="formPartita">
          <div class="grid3">
            <div class="field"><label for="pData">Data</label><input id="pData" type="date" required></div>
            <div class="field"><label for="pOra">Ora</label><input id="pOra" type="time"></div>
            <div class="field"><label for="pSq">Squadra</label>
              <select id="pSq"><option>Serie B</option><option>Serie D</option><option>Cadetti</option><option>Juniores</option><option>Allievi</option><option>Ragazzi</option></select></div>
          </div>
          <div class="grid2">
            <div class="field"><label for="pAvv">Avversario</label><input id="pAvv" type="text" maxlength="80" placeholder="Es. Nuoto Club Roma" required></div>
            <div class="field"><label for="pTipo">Casa / Trasferta</label><select id="pTipo"><option value="casa">Casa</option><option value="trasferta">Trasferta</option></select></div>
          </div>
          <div class="grid2">
            <div class="field"><label for="pLuogo">Piscina / luogo</label><input id="pLuogo" type="text" maxlength="120" placeholder="Es. Sporting Village The Monster"></div>
            <div class="field"><label for="pRis">Risultato (a partita finita)</label><input id="pRis" type="text" maxlength="20" placeholder="Es. 12-9"></div>
          </div>
          <div class="actions" style="justify-content:flex-start">
            <button class="btn" type="submit" id="salvaPartita">Salva partita</button>
            <button class="btn line hidden" type="button" id="annullaMod">Annulla modifica</button>
          </div>
          <p class="msg" id="pMsg"></p>
        </form>
      </div>
      <div class="card"><h2>Calendario</h2><div id="listaPartite"><p class="empty">Caricamento…</p></div></div>
    </section>

    <!-- FOTO -->
    <section id="t-foto" class="hidden">
      <div class="card">
        <h2>Carica foto</h2>
        <div class="field"><label for="fFile">Scegli una o più foto</label><input id="fFile" type="file" accept="image/*" multiple></div>
        <button class="btn" id="caricaFoto">Carica nella galleria</button>
        <div class="prog hidden" id="prog"><i></i></div>
        <p class="msg" id="fMsg"></p>
        <p class="empty" style="font-size:.82rem">Le foto vengono ridimensionate automaticamente (max 1600 px) per tenere il sito veloce.</p>
      </div>
      <div class="card"><h2>Galleria</h2><div class="fotogrid" id="listaFoto"><p class="empty">Caricamento…</p></div></div>
    </section>

    <!-- MESSAGGI -->
    <section id="t-messaggi" class="hidden">
      <div class="card"><h2>Messaggi ricevuti</h2><div id="listaMessaggi"><p class="empty">Caricamento…</p></div></div>
    </section>
  </main>
</div>

<script type="module">
import { firebaseConfig, configurato } from '../firebase-config.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, addDoc, setDoc, doc, deleteDoc, updateDoc, onSnapshot, query, orderBy, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { getStorage, ref, uploadBytesResumable, getDownloadURL, deleteObject } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js';

const $ = id => document.getElementById(id);
const say = (el, t, ok) => { el.textContent = t; el.className = 'msg ' + (ok ? 'ok' : 'err'); };
function el(tag, props = {}, ...kids){
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  kids.flat().forEach(c => e.append(c));
  return e;
}

if (!configurato) {
  $('lMsg').textContent = 'Firebase non è ancora configurato: compila il file firebase-config.js (vedi README).';
  $('formLogin').querySelector('button').disabled = true;
  throw new Error('Firebase non configurato');
}

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

/* ---------- LOGIN ---------- */
$('formLogin').addEventListener('submit', async e => {
  e.preventDefault();
  $('lMsg').textContent = '';
  try { await signInWithEmailAndPassword(auth, $('lEmail').value.trim(), $('lPass').value); }
  catch { $('lMsg').textContent = 'Email o password non corretti.'; }
});
$('esci').addEventListener('click', () => signOut(auth));

let unsubs = [];
onAuthStateChanged(auth, user => {
  unsubs.forEach(u => u()); unsubs = [];
  if (user) {
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    $('utente').textContent = user.email;
    avvia();
  } else {
    $('app').classList.add('hidden'); $('login').classList.remove('hidden');
    $('lPass').value = '';
  }
});

/* ---------- TAB ---------- */
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  ['partite', 'foto', 'messaggi'].forEach(t => $('t-' + t).classList.toggle('hidden', t !== b.dataset.tab));
}));

function avvia(){
  /* ---------- PARTITE ---------- */
  unsubs.push(onSnapshot(query(collection(db, 'partite'), orderBy('data', 'asc')), snap => {
    const box = $('listaPartite'); box.replaceChildren();
    if (snap.empty) { box.append(el('p', { class: 'empty' }, 'Nessuna partita inserita.')); return; }
    const oggi = new Date().toISOString().slice(0, 10);
    const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    // prima le prossime, poi le passate (più recenti in alto)
    const prossime = docs.filter(p => p.data >= oggi);
    const passate = docs.filter(p => p.data < oggi).reverse();
    [...prossime, ...passate].forEach(p => box.append(rigaPartita(p, p.data < oggi)));
  }, err => say($('pMsg'), 'Errore lettura partite: ' + err.code, false)));

  /* ---------- FOTO ---------- */
  unsubs.push(onSnapshot(query(collection(db, 'foto'), orderBy('creato', 'desc')), snap => {
    const box = $('listaFoto'); box.replaceChildren();
    if (snap.empty) { box.append(el('p', { class: 'empty' }, 'Nessuna foto caricata.')); return; }
    snap.docs.forEach(d => box.append(cardFoto(d.id, d.data())));
  }, err => say($('fMsg'), 'Errore lettura foto: ' + err.code, false)));

  /* ---------- MESSAGGI ---------- */
  unsubs.push(onSnapshot(query(collection(db, 'messaggi'), orderBy('creato', 'desc')), snap => {
    const box = $('listaMessaggi'); box.replaceChildren();
    const nuovi = snap.docs.filter(d => !d.data().letto).length;
    $('nuovi').textContent = nuovi; $('nuovi').classList.toggle('hidden', !nuovi);
    if (snap.empty) { box.append(el('p', { class: 'empty' }, 'Nessun messaggio.')); return; }
    snap.docs.forEach(d => box.append(cardMessaggio(d.id, d.data())));
  }, err => box0('listaMessaggi', 'Errore lettura messaggi: ' + err.code)));
}
function box0(id, t){ $(id).replaceChildren(el('p', { class: 'empty' }, t)); }

/* ---------- Partite: UI ---------- */
const fmtData = iso => { const [y, m, d] = iso.split('-'); return { g: d + '/' + m, a: y }; };
function rigaPartita(p, passata){
  const f = fmtData(p.data);
  const casa = p.tipo === 'casa';
  const titolo = casa ? `Roma De Virtute vs ${p.avversario}` : `${p.avversario} vs Roma De Virtute`;
  return el('div', { class: 'item' + (passata ? ' passata' : '') },
    el('div', { class: 'd' }, f.g, el('small', {}, f.a)),
    el('div', {},
      el('h3', {}, titolo, el('span', { class: 'pill' }, casa ? 'Casa' : 'Trasferta'), p.risultato ? el('span', { class: 'pill res' }, p.risultato) : ''),
      el('p', {}, [p.squadra, p.ora, p.luogo].filter(Boolean).join(' · '))),
    el('div', { class: 'actions' },
      el('button', { class: 'btn line sm', onclick: () => modificaPartita(p) }, 'Modifica'),
      el('button', { class: 'btn danger sm', onclick: async () => { if (confirm('Eliminare questa partita?')) await deleteDoc(doc(db, 'partite', p.id)); } }, 'Elimina')));
}
let inModifica = null;
function resetForm(){
  inModifica = null; $('formPartita').reset();
  $('titoloForm').textContent = 'Aggiungi partita'; $('salvaPartita').textContent = 'Salva partita';
  $('annullaMod').classList.add('hidden');
}
function modificaPartita(p){
  inModifica = p.id;
  $('pData').value = p.data; $('pOra').value = p.ora || ''; $('pSq').value = p.squadra || 'Serie B';
  $('pAvv').value = p.avversario; $('pTipo').value = p.tipo || 'casa'; $('pLuogo').value = p.luogo || ''; $('pRis').value = p.risultato || '';
  $('titoloForm').textContent = 'Modifica partita'; $('salvaPartita').textContent = 'Aggiorna partita';
  $('annullaMod').classList.remove('hidden'); scrollTo({ top: 0, behavior: 'smooth' });
}
$('annullaMod').addEventListener('click', resetForm);
$('formPartita').addEventListener('submit', async e => {
  e.preventDefault();
  const dati = {
    data: $('pData').value, ora: $('pOra').value, squadra: $('pSq').value,
    avversario: $('pAvv').value.trim(), tipo: $('pTipo').value,
    luogo: $('pLuogo').value.trim(), risultato: $('pRis').value.trim()
  };
  $('salvaPartita').disabled = true;
  try {
    if (inModifica) await setDoc(doc(db, 'partite', inModifica), dati);
    else await addDoc(collection(db, 'partite'), { ...dati, creato: serverTimestamp() });
    say($('pMsg'), inModifica ? 'Partita aggiornata ✔' : 'Partita aggiunta ✔', true);
    resetForm();
  } catch (err) { say($('pMsg'), 'Errore: ' + err.code, false); }
  $('salvaPartita').disabled = false;
});

/* ---------- Foto: UI ---------- */
function comprimi(file, max = 1600, q = .85){
  return new Promise((ok, ko) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? ok(b) : ko(new Error('compressione')), 'image/jpeg', q);
    };
    img.onerror = () => ko(new Error('immagine non valida')); img.src = url;
  });
}
$('caricaFoto').addEventListener('click', async () => {
  const files = [...$('fFile').files];
  if (!files.length) return say($('fMsg'), 'Scegli almeno una foto.', false);
  const btn = $('caricaFoto'); btn.disabled = true; $('prog').classList.remove('hidden');
  let fatte = 0;
  try {
    for (const f of files) {
      const blob = await comprimi(f);
      const path = `foto/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
      const r = ref(storage, path);
      const task = uploadBytesResumable(r, blob, { contentType: 'image/jpeg' });
      await new Promise((ok, ko) => task.on('state_changed',
        s => { $('prog').firstChild.style.width = ((fatte + s.bytesTransferred / s.totalBytes) / files.length * 100) + '%'; }, ko, ok));
      const url = await getDownloadURL(r);
      await addDoc(collection(db, 'foto'), { url, path, creato: serverTimestamp() });
      fatte++;
    }
    say($('fMsg'), `${fatte} foto caricate ✔`, true); $('fFile').value = '';
  } catch (err) { say($('fMsg'), 'Errore upload: ' + (err.code || err.message), false); }
  btn.disabled = false; setTimeout(() => { $('prog').classList.add('hidden'); $('prog').firstChild.style.width = 0; }, 800);
});
function cardFoto(id, f){
  return el('div', { class: 'foto' },
    el('img', { src: f.url, alt: '', loading: 'lazy' }),
    el('div', {}, el('span', {}, f.creato ? f.creato.toDate().toLocaleDateString('it-IT') : ''),
      el('button', { class: 'btn danger sm', onclick: async () => {
        if (!confirm('Eliminare questa foto?')) return;
        try { await deleteObject(ref(storage, f.path)); } catch {}
        await deleteDoc(doc(db, 'foto', id));
      } }, 'Elimina')));
}

/* ---------- Messaggi: UI ---------- */
function cardMessaggio(id, m){
  const quando = m.creato ? m.creato.toDate().toLocaleString('it-IT', { dateStyle: 'medium', timeStyle: 'short' }) : '…';
  const contatti = el('div', { class: 'contatti' }, 'Email: ', el('a', { href: 'mailto:' + m.email }, m.email));
  if (m.telefono) contatti.append(' · Tel: ', el('a', { href: 'tel:' + m.telefono }, m.telefono));
  return el('div', { class: 'mess' + (m.letto ? '' : ' nuovo') },
    el('header', {}, el('b', {}, m.nome, m.letto ? '' : el('span', { class: 'pill' }, 'Nuovo')), el('time', {}, quando)),
    contatti,
    el('p', { class: 'testo' }, m.messaggio),
    el('div', { class: 'actions', style: 'justify-content:flex-start' },
      el('a', { class: 'btn sm', href: 'mailto:' + m.email + '?subject=' + encodeURIComponent('Re: Roma De Virtute') }, 'Rispondi'),
      el('button', { class: 'btn line sm', onclick: () => updateDoc(doc(db, 'messaggi', id), { letto: !m.letto }) }, m.letto ? 'Segna da leggere' : 'Segna come letto'),
      el('button', { class: 'btn danger sm', onclick: async () => { if (confirm('Eliminare il messaggio?')) await deleteDoc(doc(db, 'messaggi', id)); } }, 'Elimina')));
}
</script>
</body>
</html>
